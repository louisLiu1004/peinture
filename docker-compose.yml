services:
  peinture:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: peinture
    ports:
      - "13000:80"
    env_file:
      - .env
    environment:
      # AI Service Tokens (backend proxy)
      - HF_TOKEN=${HF_TOKEN:-}
      - GITEE_TOKEN=${GITEE_TOKEN:-}
      - MS_TOKEN=${MS_TOKEN:-}
      - OPENROUTER_API_URL=${OPENROUTER_API_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_COMPAT_API_URL=${OPENAI_COMPAT_API_URL:-}
      - OPENAI_COMPAT_API_KEY=${OPENAI_COMPAT_API_KEY:-}
      # Storage Configuration (backend proxy)
      - STORAGE_TYPE=${STORAGE_TYPE:-off}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_PUBLIC_DOMAIN=${S3_PUBLIC_DOMAIN:-}
      - S3_PREFIX=${S3_PREFIX:-peinture/}
      - WEBDAV_URL=${WEBDAV_URL:-}
      - WEBDAV_USER=${WEBDAV_USER:-}
      - WEBDAV_PASSWORD=${WEBDAV_PASSWORD:-}
      - WEBDAV_DIRECTORY=${WEBDAV_DIRECTORY:-peinture}
      # Proxy Server Port
      - PROXY_PORT=3001
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
