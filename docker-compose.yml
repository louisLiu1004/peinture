version: '3.8'

services:
  peinture:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: peinture
    ports:
      - "13000:80"
    env_file:
      - .env
    environment:
      # These can be set in .env file or overridden here
      - OPENROUTER_API_URL=${OPENROUTER_API_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - PROXY_PORT=3001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
